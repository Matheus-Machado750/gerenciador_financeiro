<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Gerenciador Financeiro</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>


<body>

    <section class="auth_container {% if modo == 'cadastro' %} modo-cadastro {% else %} modo-login {% endif %}" id="authContainer">

    <!-- ////////////////////////// PARTE LOGIN ////////////////////////// -->    

        <div class="campo_login">

            <form action="{{ url_for('login') }}" method="POST" class="formulario_login">
                <h2>Bem-vindo de volta!</h2>

                <input type="email" name="email" autocomplete="email" placeholder="Email" required>
                <input type="password" name="senha" autocomplete="current-password" placeholder="Senha" required>

                <input type="checkbox" id="lembrar-de-mim" name="lembrar">
                <label for="lembrar-de-mim"> Lembrar de mim </label>

                <button type="submit"> Login </button>

                <p>
                    Ainda não tem uma conta?
                    <button type="button" id="mostrarCadastro"> Cadastre-se </button>
                </p>

            </form>

        </div>

    <!-- ////////////////////////// PARTE CADASTRO ////////////////////////// -->

        <div class="campo_cadastro">

            <form action="{{ url_for('cadastro') }}" method="POST" class="formulario_cadastro">
                <h2>Crie uma conta</h2>

                <input type="email" name="email" autocomplete="email" placeholder="Email" required>
                <input type="password" name="senha" autocomplete="new-password" placeholder="Crie uma senha" required>
                <input type="password" name="confirmar_senha" autocomplete="new-password" placeholder="Confirme sua senha" required>

                <button type="submit"> Cadastrar </button>

                <p>
                    Já possui uma conta?
                    <button type="button" id="mostrarLogin"> Entrar </button>
                </p>

            </form>

        </div>

    </section>

<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
